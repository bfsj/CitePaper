# Single-host deployment template. This machine has no Docker; not runtime-verified here.
services:
  api:
    build: .
    env_file: .env
    environment:
      CITEPAPER_DATABASE: /data/citepaper.sqlite3
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - citepaper-data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 10s
      timeout: 3s
      retries: 3
  worker:
    build: .
    command: ['cite-paper', 'worker']
    env_file: .env
    environment:
      CITEPAPER_DATABASE: /data/citepaper.sqlite3
    volumes:
      - citepaper-data:/data
    restart: unless-stopped
volumes:
  citepaper-data:
