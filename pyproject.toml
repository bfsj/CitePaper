[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cite-paper"
version = "0.2.0"
description = "A verifiable deep-research agent for computer science papers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1",
    "uvicorn>=0.35,<1",
    "httpx>=0.28,<1",
    "langgraph>=1,<2",
    "pypdf>=6,<7",
    "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
local = ["torch>=2.6,<3", "transformers>=4.57,<5"]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
    "reportlab>=4,<5",
]

[project.scripts]
cite-paper = "cite_paper.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cite_paper"]

[tool.fastapi]
entrypoint = "cite_paper.api:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["cite_paper"]

[tool.coverage.report]
show_missing = true
